[build-system]
requires = ["poetry-core>=1.3.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "char-lstm"
version = "0.1.0"
description = "Character-level LSTM training for Turkic languages"
authors = ["Austin Wagner <austinwagner@msn.com>"]
packages = [
  { include = "char_lstm", from = "src" }
]
include = ["src/char_lstm/py.typed"]

[[tool.poetry.source]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
priority = "explicit"

[tool.poetry.dependencies]
python = "^3.11"
torch = {version = "^2.5", source = "pytorch-cu124"}
numpy = "^2.0"
wandb = "^0.23.0"
rich = "^14.2.0"
# The shared comparability contract: RunRecord, RunFingerprint, and the
# machinery that decides whether two measured numbers may be subtracted.
#
# A GIT dependency, not a path one, and the reason is concrete. It was
# `{ path = "../API/libs/platform_core" }` for half a day, which resolves on
# the workstation (~/PROJECTS/API beside ~/PROJECTS/LSTM) and CANNOT resolve
# on HPC3, where the monorepo is checked out at /pub/wagnera3/api -- lowercase,
# on a case-sensitive filesystem. A relative path dependency silently encodes
# an assumption about directory layout, and that assumption was the single
# thing keeping this project off the cluster.
#
# The lock file pins a commit, which is the other half of why this is better:
# a run's provenance now includes exactly which platform_core computed its
# fingerprint, rather than whatever happened to be checked out next door.
platform-core = { git = "https://github.com/wagner-austin/API.git", subdirectory = "libs/platform_core" }

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^4.1.0"
pytest-xdist = "^3.6.1"
pytest-timeout = "^2.3.1"
mypy = "^1.13.0"
ruff = "^0.14.4"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_subclassing_any = true
disallow_any_generics = true
no_implicit_optional = true
check_untyped_defs = true
no_implicit_reexport = true
show_error_codes = true
pretty = true
files = ["src", "tests", "scripts"]
mypy_path = ["src"]
explicit_package_bases = true

# Note: disallow_any_expr, disallow_any_decorated, disallow_any_explicit, and
# disallow_any_unimported are incompatible with PyTorch. PyTorch's stubs use
# Any extensively - nn.Module methods return Any, tensor operations return Any,
# and even isinstance(x, Tensor) fails because Tensor's type definition
# contains Any. These settings are kept disabled to allow PyTorch usage while
# maintaining all other strict type checking.

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# `analysis` joins `diagnostics` as archived output rather than maintained
# source: one-off scripts kept as the record of a finished experiment
# (punctuation-2026-08, rebuild-2026-08). Mypy already scopes itself to
# `src tests scripts` and never saw them; ruff did, and reported 53 missing
# annotations and long lines that had been failing `make lint` since those
# experiments were archived. Scoping the two tools alike is the fix; the
# alternative was annotating scripts nobody will run again.
exclude = [".venv", "diagnostics", "analysis"]

[tool.ruff.lint]
select = [
    "E","F","I","B","BLE","UP","N","C4","SIM","RET","C90","RUF","ANN"
]
ignore = []
# IPA transcription project: these phonetic symbols are intentional content,
# not lookalike typos (RUF001/RUF002/RUF003).
allowed-confusables = ["ɑ", "ɯ", "ɪ", "ʏ", "ʔ", "ː", "’", "–", "ʋ", "ɡ", "ɣ"]
fixable = ["ALL"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = false
mypy-init-return = true

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any" = { msg = "Do not use typing.Any; prefer precise types or Protocols/TypedDicts." }
"typing.cast" = { msg = "Do not use typing.cast; prefer adapters or precise types." }

[tool.coverage.run]
source = ["src", "scripts"]
omit = []
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
fail_under = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v -n auto --dist loadscope"
timeout = 60
timeout_method = "thread"
